# Nginx принимает внешний HTTP-трафик и направляет его к нужному сервису.
server {
    listen 80;
    server_name _;

    # Ограничение защищает учебный контур от слишком больших запросов.
    client_max_body_size 10m;

    # Источник статических файлов frontend монтируется из каталога проекта.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Единый URL со слешем нужен pgAdmin для корректной работы относительных путей.
    location = /pgadmin {
        return 301 /pgadmin/;
    }

    # pgAdmin не публикует собственный порт на хосте.
    # Слеш в proxy_pass нельзя: при SCRIPT_NAME=/pgadmin приложение
    # требует исходный путь /pgadmin/..., а не обрезанный /.
    location /pgadmin/ {
        proxy_pass http://pgadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend не публикует host-порт и доступен через Nginx.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
