# Учебный контур запускается одной командой и не требует локальной установки БД.
services:
  # Единственная точка входа для frontend и внутренних веб-сервисов.
  nginx:
    image: nginx:1.27-alpine
    container_name: orders-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      pgadmin:
        condition: service_started
      backend:
        condition: service_started
    networks:
      - public
      - private
    restart: unless-stopped

  # Backend доступен только внутри private-сети и через Nginx.
  backend:
    build:
      context: ./backend
    container_name: orders-backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_started
    networks:
      - private
    restart: unless-stopped

  # Порт не публикуется: база доступна только внутри private-сети.
  postgres:
    image: postgres:17-alpine
    container_name: orders-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    restart: unless-stopped

  # Веб-интерфейс администрирования БД доступен через Nginx по /pgadmin/.
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: orders-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      SCRIPT_NAME: /pgadmin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_started
    networks:
      - public
      - private
    restart: unless-stopped

  # Учебный HTTP Registry для образов будущего backend.
  # В production этот сервис должен работать через TLS.
  registry:
    image: registry:2
    container_name: orders-registry
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Docker Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry_data:/var/lib/registry
      - ./registry/auth:/auth:ro
    networks:
      - public
    restart: unless-stopped

  # Обновляет только контейнеры с меткой Watchtower.
  # DOCKER_API_VERSION задаёт минимальную API-версию, которую принимает новый daemon.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: orders-watchtower
    environment:
      DOCKER_API_VERSION: "1.40"
    command: --label-enable --cleanup --interval 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  # Сюда подключены сервисы, которым нужен внешний HTTP-доступ.
  public:
    name: orders_public
  # Флаг internal блокирует прямой выход этой сети наружу.
  private:
    name: orders_private
    internal: true

# Volumes сохраняют данные при пересоздании контейнеров.
volumes:
  postgres_data:
  pgadmin_data:
  registry_data:
